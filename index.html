</div><script>(function(){const c=document.getElementById('intro-canvas'),g=c.getContext('webgl')||c.getContext('experimental-webgl');if(!g)return;c.width=innerWidth;c.height=innerHeight;let p=[];for(let i=0;i<150;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,a:Math.random(),r:Math.random()*3+1});function d(){g.clearColor(.02,.04,.03,1);g.clear(g.COLOR_BUFFER_BIT);p.forEach(n=>{n.x+=n.vx;n.y+=n.vy;n.a-=.002;if(n.a<=0){n.a=1;n.x=Math.random()*c.width;n.y=Math.random()*c.height}if(n.x<0||n.x>c.width)n.vx*=-1;if(n.y<0||n.y>c.height)n.vy*=-1;for(let m of p)if(n!==m){const dx=n.x-m.x,dy=n.y-m.y,d=Math.sqrt(dx*dx+dy*dy);if(d<60){n.vx+=dx/d*.005;n.vy+=dy/d*.005}}g.begin=g.begin||function(){};g.color=g.color||function(){};g.color(197/255,160/255,89/255,n.a);g.drawArrays(g.POINTS,0,1)});requestAnimationFrame(d)}d()})();function skipIntro(){document.getElementById('intro-canvas').style.display='none';document.getElementById('intro-skip').style.display='none';document.getElementById('loader-overlay').style.display='block';let p=0;const e=document.getElementById('loader-progress'),b=document.getElementById('loader-bar-fill'),i=setInterval(()=>{p++;e.textContent=p+'%';b.style.width=p+'%';if(p>=100){clearInterval(i);setTimeout(()=>{document.getElementById('loader-overlay').style.display='none';document.getElementById('site-content').classList.add('visible')},600)}},15)}window.addEventListener('load',skipIntro);</script></body>
